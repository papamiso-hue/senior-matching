# Render 설정 파일 (비밀값은 여기에 적지 않습니다. 비밀값은 Render 'Secret Files'에 넣습니다)
services:
  - type: web
    name: noblesse-raon
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SITE_URL
        value: https://noblesseraon.com
